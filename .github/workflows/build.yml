name: Android Build Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-disabled: false

      - name: Build Debug APKs
        run: ./gradlew assembleDebug --build-cache

      - name: Collect APKs to flat directory
        run: |
          mkdir -p collected-apks
          find . -name "*.apk" -path "*/build/outputs/apk/debug/*" -exec cp {} collected-apks/ \;
          echo "Collected files:"
          ls -lh collected-apks/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: collected-apks/
          if-no-files-found: error
          archive: false

      - name: Cleanup
        if: always()
        run: rm -rf collected-apks || true
